<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시약장을 부탁해</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v='20260608-2') }}" />
  </head>
  <body>
    <main id="app"></main>

    <template id="homeTemplate">
      <section class="hero dark-hero">
        <div>
          <p class="pill">AI · Science Lab Platform</p>
          <h1>시약장을 부탁해</h1>
          <p class="credits">제작자 민혜주 · 황예음 · 강규빈</p>
          <p class="lead">천진한국국제학교 선생님들과 학생들이 과학실을 보다 효율적이고 편하게 사용할 수 있도록 제작한 AI 기반 플랫폼입니다.</p>
        </div>
        <div class="stat-grid">
          <article><span id="statReagents">0</span><p>등록 시약</p></article>
          <article><span id="statDanger">0</span><p>주의 시약</p></article>
          <article><span id="statCheck">0</span><p>점검 임박/경과</p></article>
          <article><span id="statPending">0</span><p>승인 대기</p></article>
        </div>
      </section>

      <section class="app-shell">
        <section class="panel">
          <h2>사용자 역할 선택</h2>
          <p class="muted">학생은 시약 검색과 과학실 사용 신청을, 선생님은 시약 관리와 신청 승인을 할 수 있습니다.</p>
          <div class="role-grid">
            <button class="role-card" id="studentModeButton" type="button">
              <strong>학생으로 시작</strong>
              <span>학교에서 발급받은 학번 계정으로 시약 검색과 과학실 사용 신청을 합니다.</span>
            </button>
            <button class="role-card" id="teacherModeButton" type="button">
              <strong>선생님 로그인</strong>
              <span>시약 관리와 신청서 확인을 위해 선생님 계정으로 접속합니다.</span>
            </button>
          </div>
        </section>

        <section class="panel auth-panel" id="loginPanel" hidden>
          <h2 id="loginTitle">로그인</h2>
          <form id="accountLoginForm" class="form-grid two">
            <input name="username" placeholder="아이디 또는 학번" autocomplete="username" required />
            <input name="password" type="password" placeholder="비밀번호" autocomplete="current-password" required />
            <button type="submit">로그인</button>
          </form>
          <div class="auth-actions">
            <p class="hint" id="loginHint">발급 또는 가입 승인을 받은 계정으로 로그인하세요.</p>
            <button class="secondary" id="showTeacherSignup" type="button">선생님 회원가입</button>
          </div>
          <p class="privacy-note" id="studentPrivacyNote" hidden>학생 계정에는 이름, 학번, 암호화된 비밀번호만 저장합니다.</p>
        </section>

        <section class="panel auth-panel" id="signupPanel" hidden>
          <h2>선생님 회원가입 신청</h2>
          <form id="signupForm" class="signup-form">
            <div class="form-grid two-equal">
              <label>이름<input name="name" placeholder="실명" required /></label>
              <label>아이디<input name="username" minlength="4" placeholder="4자 이상" autocomplete="username" required /></label>
              <label>비밀번호<input name="password" minlength="8" type="password" placeholder="8자 이상" autocomplete="new-password" required /></label>
              <label>선생님 가입 초대키<input name="invite_key" type="password" placeholder="담당 관리자에게 문의" required /></label>
            </div>
            <div class="privacy-box">
              <strong>개인정보 수집 및 이용 안내</strong>
              <p>수집 항목: 이름, 아이디, 비밀번호 해시, 사용자 권한</p>
              <p>이용 목적: 선생님 사용자 확인과 과학실 관리 기능 제공</p>
              <p>보유 기간: 재학·재직 기간 또는 회원 탈퇴 시까지</p>
              <label class="check-label"><input name="privacy_agreed" type="checkbox" /> 위 내용을 확인했고 수집 및 이용에 동의합니다.</label>
            </div>
            <button type="submit">가입 신청하기</button>
          </form>
          <p class="hint">가입 후 최고 관리자의 승인이 필요합니다.</p>
        </section>
      </section>
    </template>

    <template id="dashboardTemplate">
      <section class="hero compact-hero">
        <div>
          <p class="pill">Science Lab Safety</p>
          <h1 id="dashboardTitle">대시보드</h1>
          <p class="lead" id="dashboardSubtitle"></p>
        </div>
        <button class="ghost light" id="logoutButton" type="button">처음 화면으로</button>
      </section>
      <section class="app-shell dashboard-grid" id="dashboardBody"></section>
    </template>

    <script src="{{ url_for('static', filename='app.js', v='20260608-2') }}"></script>
  </body>
</html>
