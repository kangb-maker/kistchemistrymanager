<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시약장을 부탁해</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main id="app"></main>

    <template id="homeTemplate">
      <section class="hero dark-hero">
        <div>
          <p class="pill">AI · Science Lab Platform</p>
          <h1>시약장을 부탁해</h1>
          <p class="credits">제작: 강규빈 · 민혜주 · 황예음</p>
          <p class="lead">천진한국국제학교 선생님들과 학생들이 과학실을 보다 효율적이고 편하게 사용할 수 있도록 제작한 AI 기반 플랫폼입니다.</p>
        </div>
        <div class="stat-grid">
          <article><span id="statReagents">0</span><p>등록 시약</p></article>
          <article><span id="statDanger">0</span><p>주의 시약</p></article>
          <article><span id="statCheck">0</span><p>점검 임박/경과</p></article>
          <article><span id="statPending">0</span><p>승인 대기</p></article>
        </div>
      </section>

      <section class="app-shell">
        <section class="panel">
          <h2>사용자 역할 선택</h2>
          <p class="muted">학생은 시약 검색과 과학실 사용 신청을, 선생님은 시약 관리와 신청 승인을 할 수 있습니다.</p>
          <div class="role-grid">
            <button class="role-card" id="studentModeButton" type="button">
              <strong>학생으로 시작</strong>
              <span>시약 검색, AI 안전 정보 확인, 과학실 사용 신청</span>
            </button>
            <button class="role-card" id="teacherModeButton" type="button">
              <strong>선생님으로 시작</strong>
              <span>시약 등록·수정·삭제, 학생 계획서 확인, 승인/반려</span>
            </button>
          </div>
        </section>

        <section class="panel auth-panel" id="studentLoginPanel" hidden>
          <h2>학생 로그인</h2>
          <form id="studentLoginForm" class="form-grid three">
            <input name="name" placeholder="이름" required />
            <input name="student_id" placeholder="학번" required />
            <input name="password" type="password" placeholder="학생 비밀번호" required />
            <button type="submit">학생 로그인</button>
          </form>
          <p class="hint">발표용 예시 학생 비밀번호: student1234</p>
        </section>

        <section class="panel auth-panel" id="teacherLoginPanel" hidden>
          <h2>선생님 관리자 로그인</h2>
          <form id="teacherLoginForm" class="form-grid two">
            <input name="teacher_key" type="password" placeholder="교사 관리자 비밀번호" required />
            <button type="submit">로그인</button>
          </form>
          <p class="hint">발표용 예시 교사 비밀번호: teacher1234</p>
        </section>
      </section>
    </template>

    <template id="dashboardTemplate">
      <section class="hero compact-hero">
        <div>
          <p class="pill">Science Lab Safety</p>
          <h1 id="dashboardTitle">대시보드</h1>
          <p class="lead" id="dashboardSubtitle"></p>
        </div>
        <button class="ghost light" id="logoutButton" type="button">처음 화면으로</button>
      </section>
      <section class="app-shell dashboard-grid" id="dashboardBody"></section>
    </template>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
