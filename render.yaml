services:
  - type: web
    name: science-lab-safety
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: TEACHER_SIGNUP_KEY
        value: teacher-invite-2026
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: change-this-admin-password
      - key: TEMP_STUDENT_USERNAME
        value: student01
      - key: TEMP_STUDENT_PASSWORD
        value: student1234
